<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Queen</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&family=Playfair+Display:italic,wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --dark: #0a0a0a; --white: #ffffff; }
        body, html { margin: 0; padding: 0; background-color: var(--dark); color: var(--white); font-family: 'Montserrat', sans-serif; scroll-behavior: smooth; height: 100%; }
        
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom, rgba(10,10,10,0.4), #0a0a0a), url('photo.jpg');
            background-size: cover;
            background-position: center;
        }

        h1 { font-family: 'Cinzel', serif; font-size: clamp(2rem, 8vw, 5rem); letter-spacing: 12px; color: var(--gold); text-transform: uppercase; margin: 10px 0; }

        .timer-container {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
        }

        .timer-grid { display: flex; gap: 15px; }
        .timer-item span { display: block; font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--gold); }
        .timer-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; }

        .music-player { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .music-btn { background: rgba(212, 175, 55, 0.2); border: 1px solid var(--gold); color: var(--gold); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        .content { padding: 150px 20px; text-align: center; min-height: 50vh; }
        .quote { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-style: italic; line-height: 1.8; color: #fcfaf2; max-width: 700px; margin: 0 auto; }

        .cta-button {
            margin-top: 40px;
            padding: 15px 35px;
            border: 1px solid var(--gold);
            background: none;
            color: var(--gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            text-decoration: none;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="music-player">
        <audio id="myAudio" loop preload="auto">
            <source src="music.mp3" type="audio/mpeg">
        </audio>
        <button class="music-btn" id="musicIcon" onclick="toggleMusic()">♪</button>
    </div>

    <section class="hero">
        <div style="font-family: 'Playfair Display'; font-style: italic; letter-spacing: 5px; margin-bottom: 5px;">Queen of My Heart</div>
        <h1>Её Величество</h1>
        
        <div class="timer-container">
            <div style="margin-bottom: 10px; font-size: 0.7rem; letter-spacing: 3px; color: var(--gold);">МЫ ВМЕСТЕ:</div>
            <div class="timer-grid">
                <div class="timer-item"><span id="days">0</span><div class="timer-label">Дней</div></div>
                <div class="timer-item"><span id="hours">0</span><div class="timer-label">Час</div></div>
                <div class="timer-item"><span id="mins">0</span><div class="timer-label">Мин</div></div>
                <div class="timer-item"><span id="secs">0</span><div class="timer-label">Сек</div></div>
            </div>
        </div>
        <button class="cta-button" onclick="openHeart()">Открыть сердце</button>
    </section>

    <section id="about" class="content">
        <div class="quote" id="finalQuote">
            «С 31 июля 2025 года мой мир изменился навсегда. Ты — самое красивое, что когда-либо случалось со мной.»
        </div>
    </section>

    <script>
        const audio = document.getElementById("myAudio");
        
        function toggleMusic() {
            if (audio.paused) {
                audio.play().catch(e => console.log("Нужно взаимодействие"));
                document.getElementById('musicIcon').style.background = "rgba(212, 175, 55, 0.5)";
            } else {
                audio.pause();
                document.getElementById('musicIcon').style.background = "rgba(212, 175, 55, 0.2)";
            }
        }

        function openHeart() {
            // При нажатии включаем музыку (обходим блок браузера)
            if (audio.paused) toggleMusic();
            
            // Скроллим к цитате
            document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
        }

        const startDate = new Date('2025-07-31T14:00:00'); 
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
            document.getElementById('mins').innerText = Math.floor((diff / 1000 / 60) % 60);
            document.getElementById('secs').innerText = Math.floor((diff / 1000) % 60);
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
